{{ define "main" }}
<section class="section-intro">
  <div class="section-header">
    <p class="eyebrow">{{ cond .IsHome "Accueil" .Title }}</p>
    <h1>{{ .Title }}</h1>
    {{ with .Description }}<p>{{ . | replace "\n" "<br />\n" | safeHTML }}</p>{{ end }}
  </div>
  {{ if .IsSection }}
    <div class="content-body">
      {{ if .Content }}{{ .Content }}{{ else }}{{ .Summary }}{{ end }}
    </div>
  {{ end }}
</section>
{{ end }}
